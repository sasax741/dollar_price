name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        exclude:
          - os: macos-latest
            compiler: gcc

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcurl4-openssl-dev \
            libjansson-dev \
            libcmocka-dev \
            cppcheck

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install curl jansson cmocka cppcheck

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> $GITHUB_ENV
          else
            echo "CC=gcc" >> $GITHUB_ENV
          fi

      - name: Build
        run: make

      - name: Run unit tests
        run: make test

      - name: Test binary runs
        run: ./dollar --no-colors --no-cache --timeout=15

      - name: Test JSON output
        run: |
          JSON=$(./dollar --no-colors --no-cache --timeout=15 --format=json)
          echo "$JSON" | python3 -c "import json,sys; data=json.load(sys.stdin); print(f'{len(data)} cotizaciones'); assert len(data) > 0"

      - name: Static analysis (Linux)
        if: runner.os == 'Linux'
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            --suppress=constParameterCallback \
            --suppress=unusedFunction \
            --error-exitcode=1 \
            src/ include/

      - name: Verify help output
        run: ./dollar --help | grep -q "dollar"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcurl4-openssl-dev \
            libjansson-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install curl jansson

      - name: Build
        run: make

      - name: Package binary
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          OS_NAME=${{ runner.os == 'Linux' && 'linux' || 'darwin' }}
          ARCH=$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
          ASSET="dollar-${OS_NAME}-${ARCH}"
          mkdir -p dist
          cp dollar "dist/${ASSET}"
          strip "dist/${ASSET}"
          cd dist && sha256sum "${ASSET}" > "${ASSET}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: dist/*

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;
          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
